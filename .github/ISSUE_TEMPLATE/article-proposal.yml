name: 記事の提案
description: 新規記事のトピックを提案する
title: "[提案] "
labels:
  - new-article
body:
  - type: input
    id: topic
    attributes:
      label: トピック
      description: 提案する記事のタイトル・扱う内容を簡潔に記載してください。
      placeholder: 例：運動方程式
    validations:
      required: true

  - type: dropdown
    id: stage
    attributes:
      label: 対象難易度
      description: 執筆ガイド（docs）の stage に対応する難易度を選んでください。
      options:
        - beginner（初級編）
        - intermediate（中級編）
        - advanced（応用編）
        - bachelor（発展編）
        - master（探求編）
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: 記事の概要
      description: どのような内容を、どこまで扱うかを記載してください。
    validations:
      required: true

  - type: input
    id: requires
    attributes:
      label: 前提となる記事
      description: 既存記事の中に前提となるものがあれば記載してください（なければ空欄で可）。
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: 確認事項
      options:
        - label: 既存のissue・記事と重複していないか確認した
          required: true
