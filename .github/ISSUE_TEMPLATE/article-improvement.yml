name: 既存記事の改善提案
description: 既存記事の内容・構成の大幅な変更や見直しを提案する
title: "[改善] "
labels:
  - improvement
body:
  - type: input
    id: article
    attributes:
      label: 対象記事
      description: 対象記事へのパス（例：phys/advanced/mechanics/newton-second-law.md）を記載してください。
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 現状の問題点
      description: goalとの整合性、論理の飛躍、説明不足、requiresとの不整合など、具体的な問題点を記載してください。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 改善案
      description: 可能であれば、どのように直すべきかの方向性を記載してください（未定でも可）。
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: 確認事項
      options:
        - label: 誤字・表記ゆれなど軽微な修正のみの場合は、issueを立てず直接PRを出すことを理解した
          required: true
